spring:
  sql:
    init:
      mode: never
  application:
    name: fitlog-v2-server

  # --- DB 설정 (로컬 PostgreSQL 사용 예시, Docker Compose로도 구성 가능) ---
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # --- JPA (Hibernate) 설정 ---
  # --- 스키마는 Flyway(db/migration)만 변경한다. Hibernate는 검증만 한다 ---
  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholders:
      # V6: 시간대 없이 저장돼 있던 기존 감사 시각의 해석 기준 (운영 컨테이너 기본값 UTC)
      legacy_timestamp_zone: ${LEGACY_TIMESTAMP_ZONE:UTC}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post # 클라이언트 인증 방식 (예: client_secret_post)
            scope:
              - profile_nickname
              - profile_image
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id # 사용자 정보에서 고유 식별자로 사용할 속성 이름

  # --- JWT 설정: 토큰 서명 비밀키와 만료 시간 ---
jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: ${ACCESS_TOKEN_EXPIRY:7200} # 액세스 토큰 만료시간(초) 예: 3600 = 1시간
  refresh-token-expiry: 604800 # 리프레시 토큰 만료시간(초) 예: 604800 = 7일

# --- 앱 관련 설정: 프론트엔드 URL 등 (CORS, 리디렉션 용) ---
app:
  client-url: ${FRONTEND_URL:http://localhost:3000}
  cors:
    # CORS 허용 오리진(쉼표 구분). 로컬 개발 기본값 + FRONTEND_URL
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  # 과다 요청 제한 (인스턴스별, 1분 구간). 초과 시 429
  rate-limit:
    auth-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:60}    # /api/auth/** , 클라이언트 IP 기준
    write-per-minute: ${RATE_LIMIT_WRITE_PER_MINUTE:120} # 쓰기 API, 회원 기준

# --- 배포 필수 설정 ---
server:
  port: ${PORT:8080} # Render가 동적으로 할당하는 포트를 받기 위해 필수
  forward-headers-strategy: native # OAuth2 리다이렉트 시 HTTPS 유지를 위해 필수

# --- 운영 관측 ---
# 헬스체크: /actuator/health 만 공개 (세부 정보 비공개). 그 밖의 actuator 엔드포인트는 노출하지 않는다.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  pattern:
    # 모든 로그에 requestId 포함 (오류 응답의 requestId 와 같은 값)
    level: "%5p [%X{requestId:-}]"
