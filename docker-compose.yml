version: '3.8'
services:
  db:
    image: postgres:15 # PostgreSQL 15 버전 사용 (또는 최신)
    container_name: fitlog-v2-db
    restart: always
    ports:
      - "127.0.0.1:5432:5432" # 로컬 루프백에만 노출 (같은 네트워크의 다른 기기에서 접속 불가)
    environment:
      POSTGRES_USER: fitlog_user # DB 사용자명
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 환경변수를 설정하세요 (.env)} # 개발 전용 비밀번호, 운영 비밀번호 재사용 금지
      POSTGRES_DB: fitlog_v2_db # 생성할 데이터베이스 이름
    volumes:
      - postgres_data:/var/lib/postgresql/data # 데이터 영속성을 위한 볼륨

volumes:
  postgres_data: