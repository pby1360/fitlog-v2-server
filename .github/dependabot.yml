# 의존성 보안 공지·업데이트를 주기적으로 PR로 받는다 (#29)
# PR 에서는 deploy.yml 의 test 잡이 실행되어 업데이트가 테스트를 깨는지 확인할 수 있다.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
