name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  pull_request:             # PR에서는 테스트만 실행 (배포 안 함)
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: Deploy the current main commit to production
        type: boolean
        default: false
        required: true

env:
  PROJECT_ID: fitlog-505315
  REGION: asia-northeast3
  REPOSITORY: fitlog
  SERVICE: fitlog-server
  RUNTIME_SA: fitlog-run@fitlog-505315.iam.gserviceaccount.com

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      kind: ${{ steps.plan.outputs.kind }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: plan
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          CONFIRM_DEPLOY: ${{ inputs.confirm_deploy }}
        run: bash .github/scripts/classify-changes.sh

  # ── 품질 게이트: 테스트가 실패하면 배포하지 않는다 ──
  # 통합 테스트는 임베디드 PostgreSQL로 Flyway 마이그레이션 + 엔티티 검증까지 수행한다.
  test:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require a verified change range
        if: needs.changes.result != 'success'
        run: |
          echo "::error::Could not verify the files changed by this event."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Run tests
        run: |
          chmod +x ./gradlew
          ./gradlew test --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test

  deploy:
    needs: [changes, test]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.changes.outputs.kind == 'runtime'
    runs-on: ubuntu-latest

    # 배포는 한 번에 하나씩 실행한다 (오래된 커밋이 최신 배포를 덮어쓰지 않도록)
    concurrency:
      group: deploy-cloud-run
      cancel-in-progress: false

    # WIF 사용에 필수. 이게 없으면 GitHub이 OIDC 토큰을 발급하지 않는다.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Check current main
        id: latest
        run: bash .github/scripts/require-current-main.sh

      # ── 인증: 키 파일 없이 OIDC 토큰을 임시 자격증명으로 교환 ──
      - name: Authenticate to Google Cloud
        if: steps.latest.outputs.current == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

      - name: Set up gcloud
        if: steps.latest.outputs.current == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        if: steps.latest.outputs.current == 'true'
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # ── 빌드 ──
      # 태그를 커밋 SHA로 → 어느 커밋이 배포됐는지 추적 가능, 롤백 지점 명확
      - name: Build image
        if: steps.latest.outputs.current == 'true'
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE}"
          docker build --platform linux/amd64 \
            -t "${IMAGE}:${GITHUB_SHA}" \
            -t "${IMAGE}:latest" .

      # ── 안전장치: 이미지에 secret 파일이 섞여 들어갔는지 검사 ──
      # 과거에 .dockerignore 누락으로 평문 secret이 이미지에 담긴 적이 있다.
      # 사람이 매번 확인할 수 없으니 파이프라인이 대신 막는다.
      - name: Verify no secret files in image
        if: steps.latest.outputs.current == 'true'
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE}:${GITHUB_SHA}"
          JAR_CONTENTS="$RUNNER_TEMP/fitlog-jar-contents.txt"
          docker run --rm --entrypoint sh "$IMAGE" -c 'unzip -l app.jar' > "$JAR_CONTENTS"
          if grep -E 'application-(local|.*\.bak)' "$JAR_CONTENTS"; then
            echo "::error::이미지에 secret 파일이 포함됨:"
            exit 1
          fi
          echo "OK - application-local / .bak 미포함"

      # ── 안전장치: prod 프로파일 설정 누락 검사 ──
      # application-prod.yml 이 없으면 Spring이 조용히 넘어가면서 운영 전용 설정
      # (커넥션 풀, Flyway baseline 등)이 빠진 채로 기동된다.
      - name: Verify prod profile is packaged
        if: steps.latest.outputs.current == 'true'
        run: |
          grep -q 'application-prod\.yml' "$RUNNER_TEMP/fitlog-jar-contents.txt" \
            || { echo "::error::application-prod.yml 누락 — 운영 전용 설정 없이 기동될 위험"; exit 1; }
          echo "OK - application-prod.yml 포함됨"

      - name: Recheck current main before pushing the image
        if: steps.latest.outputs.current == 'true'
        id: push_image
        run: bash .github/scripts/require-current-main.sh

      - name: Push image
        if: steps.push_image.outputs.current == 'true'
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE}"
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"

      - name: Recheck current main before deploying
        if: steps.push_image.outputs.current == 'true'
        id: release
        run: bash .github/scripts/require-current-main.sh

      # ── 배포 ──
      # --image 만 지정한다. 시크릿·환경변수·인스턴스 상한 등 기존 설정은 그대로 유지된다.
      # (여기서 --set-secrets 등을 다시 나열하면 하나만 빠뜨려도 설정이 통째로 덮어써진다)
      - name: Deploy to Cloud Run
        if: steps.release.outputs.current == 'true'
        run: |
          gcloud run deploy "${SERVICE}" \
            --image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE}:${GITHUB_SHA}" \
            --region="${REGION}" \
            --project="${PROJECT_ID}" \
            --quiet

      - name: Show service URL
        if: steps.release.outputs.current == 'true'
        run: |
          echo "### 배포 완료 :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "- 커밋: \`${GITHUB_SHA}\`" >> $GITHUB_STEP_SUMMARY
          echo "- URL: $(gcloud run services describe ${SERVICE} --region=${REGION} --format='value(status.url)')" >> $GITHUB_STEP_SUMMARY
