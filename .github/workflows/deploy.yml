name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:        # 필요 시 수동 실행(롤백 등)

env:
  PROJECT_ID: fitlog-505315
  REGION: asia-northeast3
  REPOSITORY: fitlog
  SERVICE: fitlog-server
  RUNTIME_SA: fitlog-run@fitlog-505315.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest

    # WIF 사용에 필수. 이게 없으면 GitHub이 OIDC 토큰을 발급하지 않는다.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      # ── 인증: 키 파일 없이 OIDC 토큰을 임시 자격증명으로 교환 ──
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # ── 빌드 ──
      # 태그를 커밋 SHA로 → 어느 커밋이 배포됐는지 추적 가능, 롤백 지점 명확
      - name: Build image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE}"
          docker build --platform linux/amd64 \
            -t "${IMAGE}:${GITHUB_SHA}" \
            -t "${IMAGE}:latest" .

      # ── 안전장치: 이미지에 secret 파일이 섞여 들어갔는지 검사 ──
      # 과거에 .dockerignore 누락으로 평문 secret이 이미지에 담긴 적이 있다.
      # 사람이 매번 확인할 수 없으니 파이프라인이 대신 막는다.
      - name: Verify no secret files in image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE}:${GITHUB_SHA}"
          FOUND=$(docker run --rm --entrypoint sh "$IMAGE" \
                    -c "unzip -l app.jar | grep -E 'application-(local|.*\.bak)' || true")
          if [ -n "$FOUND" ]; then
            echo "::error::이미지에 secret 파일이 포함됨:"
            echo "$FOUND"
            exit 1
          fi
          echo "OK - application-local / .bak 미포함"

      # ── 안전장치: prod 프로파일 설정 누락 검사 ──
      # application-prod.yml 이 없으면 Spring이 조용히 넘어가면서
      # ddl-auto 가 validate → update 로 떨어져 운영 DB 스키마가 자동 변경된다.
      - name: Verify prod profile is packaged
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE}:${GITHUB_SHA}"
          docker run --rm --entrypoint sh "$IMAGE" \
            -c "unzip -l app.jar | grep -q 'application-prod.yml'" \
            || { echo "::error::application-prod.yml 누락 — ddl-auto가 update로 떨어질 위험"; exit 1; }
          echo "OK - application-prod.yml 포함됨"

      - name: Push image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE}"
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"

      # ── 배포 ──
      # --image 만 지정한다. 시크릿·환경변수·인스턴스 상한 등 기존 설정은 그대로 유지된다.
      # (여기서 --set-secrets 등을 다시 나열하면 하나만 빠뜨려도 설정이 통째로 덮어써진다)
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${SERVICE}" \
            --image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE}:${GITHUB_SHA}" \
            --region="${REGION}" \
            --project="${PROJECT_ID}" \
            --quiet

      - name: Show service URL
        run: |
          echo "### 배포 완료 :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "- 커밋: \`${GITHUB_SHA}\`" >> $GITHUB_STEP_SUMMARY
          echo "- URL: $(gcloud run services describe ${SERVICE} --region=${REGION} --format='value(status.url)')" >> $GITHUB_STEP_SUMMARY
